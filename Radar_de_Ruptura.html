<body><a class="skip" href="#main">Pular para o conteúdo</a><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal" aria-labelledby="modal-title"><form id="modal-form"><div id="modal-content"></div></form></dialog><noscript>Ative o JavaScript para usar a demonstração.</noscript><script type="module">// Quantidades são calculadas em milésimos inteiros, evitando erros de ponto flutuante.
const UNITS = ['un', 'kg', 'L'];
const MAX_QUANTITY = 1000000;
const MAX_ORDERS = 1000000;
function quantity(value, unit = 'kg', label = 'Quantidade') {
  if (typeof value !== 'number' && typeof value !== 'string') throw new Error(`${label}: informe um número.`);
  if (typeof value === 'string' && !/^\d+(?:[.,]\d{1,3})?$/.test(value.trim())) throw new Error(`${label}: use um número positivo com até três casas decimais.`);
  const n = Number(String(value).trim().replace(',', '.'));
  if (!Number.isFinite(n) || n < 0 || n > MAX_QUANTITY) throw new Error(`${label}: informe de 0 a 1.000.000.`);
  const scaled = Math.round(n * 1000);
  if (Math.abs(n * 1000 - scaled) > 0.000001) throw new Error(`${label}: use até três casas decimais.`);
  if (unit === 'un' && !Number.isInteger(n)) throw new Error(`${label}: unidades devem ser inteiras.`);
  return scaled;
}
function orders(value) {
  if ((typeof value !== 'number' && typeof value !== 'string') || (typeof value === 'string' && !/^\d+$/.test(value.trim()))) throw new Error('Informe a quantidade inteira de pedidos.');
  const n = Number(value);
  if (!Number.isInteger(n) || n < 0 || n > MAX_ORDERS) throw new Error('Pedidos devem ser inteiros de 0 a 1.000.000.');
  return n;
}
function text(value, label = 'Nome') {
  if (typeof value !== 'string' || !value.trim() || value.trim().length > 80) throw new Error(`${label}: use entre 1 e 80 caracteres.`);
  return value.trim();
}
function identifier(value) {
  if (typeof value !== 'string' || !/^[a-zA-Z0-9_-]{1,80}$/.test(value)) throw new Error('Identificador inválido.');
}
function validateCatalog(ingredients, recipes, demand) {
  if (!Array.isArray(ingredients) || !Array.isArray(recipes) || !demand || typeof demand !== 'object' || Array.isArray(demand)) throw new Error('Dados da operação inválidos.');
  const allIds = new Set();
  for (const i of ingredients) {
    identifier(i.id); text(i.name); if (allIds.has(i.id)) throw new Error('Ingrediente duplicado.'); allIds.add(i.id);
    if (!UNITS.includes(i.unit)) throw new Error('Unidade inválida.');
    quantity(i.stock, i.unit, 'Estoque'); quantity(i.safety, i.unit, 'Reserva');
  }
  const recipeIds = new Set();
  for (const r of recipes) {
    identifier(r.id); text(r.name);
    if (recipeIds.has(r.id)) throw new Error('Prato duplicado.'); recipeIds.add(r.id);
    if (!Array.isArray(r.items) || !r.items.length) throw new Error('Adicione pelo menos um ingrediente à receita.');
    const seen = new Set();
    for (const item of r.items) {
      const ingredient = ingredients.find(i => i.id === item.ingredientId);
      if (!ingredient) throw new Error('A receita referencia um ingrediente que não existe.');
      if (seen.has(item.ingredientId)) throw new Error('Não repita um ingrediente na mesma receita.'); seen.add(item.ingredientId);
      if (item.unit !== ingredient.unit) throw new Error('A unidade da receita deve ser igual à do ingrediente.');
      if (quantity(item.quantity, item.unit, 'Consumo por prato') <= 0) throw new Error('O consumo por prato deve ser maior que zero.');
    }
  }
  for (const [id, n] of Object.entries(demand)) { if (!recipeIds.has(id)) throw new Error('Demanda com prato inexistente.'); orders(n); }
}
function calculate(ingredients, recipes, demand) {
  validateCatalog(ingredients, recipes, demand);
  const totals = new Map(ingredients.map(i => [i.id, 0]));
  for (const recipe of recipes) for (const item of recipe.items) {
    const amount = quantity(item.quantity, item.unit) * orders(demand[recipe.id] ?? 0);
    const sum = totals.get(item.ingredientId) + amount;
    if (!Number.isSafeInteger(sum)) throw new Error('Demanda excede o limite de cálculo seguro.');
    totals.set(item.ingredientId, sum);
  }
  const rows = ingredients.map(i => {
    const required = totals.get(i.id), stock = quantity(i.stock, i.unit), safety = quantity(i.safety, i.unit);
    if (!Number.isSafeInteger(required + safety)) throw new Error('Demanda excede o limite de cálculo seguro.');
    const projected = stock - required;
    const shortage = Math.max(0, required - stock);
    const replenish = Math.max(0, required + safety - stock);
    return { ingredientId: i.id, name: i.name, unit: i.unit, stock: stock / 1000, safety: safety / 1000, required: required / 1000, projected: projected / 1000, shortage: shortage / 1000, replenish: replenish / 1000, risk: projected < 0 ? 'critical' : projected <= safety ? 'attention' : 'normal', affectedRecipes: recipes.filter(r => orders(demand[r.id] ?? 0) > 0 && r.items.some(it => it.ingredientId === i.id)).map(r => r.name) };
  });
  const menu = recipes.map(r => ({ recipeId: r.id, name: r.name, demand: orders(demand[r.id] ?? 0), capacity: Math.min(...r.items.map(it => Math.floor(quantity(ingredients.find(i => i.id === it.ingredientId).stock, it.unit) / quantity(it.quantity, it.unit)))), atRisk: orders(demand[r.id] ?? 0) > 0 && r.items.some(it => rows.some(row => row.ingredientId === it.ingredientId && row.shortage > 0)) }));
  return { rows, menu, totalOrders: menu.reduce((sum, r) => sum + r.demand, 0) };
}
function explain(result) {
  const critical = result.rows.filter(r => r.risk === 'critical');
  const attention = result.rows.filter(r => r.risk === 'attention');
  if (critical.length) return `${critical.length} ingrediente(s) não cobrem a demanda informada. Priorize a falta real antes de recompor a reserva. ${result.menu.filter(r => r.atRisk).length} prato(s) com pedidos estimados usam esses ingredientes; a divisão do estoque entre eles precisa ser decidida pelo responsável.`;
  if (attention.length) return `A demanda informada cabe no estoque. ${attention.length} ingrediente(s) ficarão no limite ou abaixo da reserva. Revise a reposição antes do próximo atendimento.`;
  return 'O estoque cobre a demanda informada e mantém todos os ingredientes acima da reserva configurada.';
}

const clone = value => structuredClone(value);
const uid = () => crypto.randomUUID();
function demo() {
  return { version: 1, restaurant: 'Bistrô Horizonte', revision: 0, ingredients: [
    {id:'pao',name:'Pão de hambúrguer',unit:'un',stock:8,safety:0},
    {id:'carne',name:'Hambúrguer bovino',unit:'un',stock:15,safety:0},
    {id:'queijo',name:'Queijo muçarela',unit:'kg',stock:0.6,safety:0.2},
    {id:'batata',name:'Batata pré-frita',unit:'kg',stock:3,safety:1},
    {id:'oleo',name:'Óleo vegetal',unit:'L',stock:2,safety:0.5},
    {id:'alface',name:'Alface higienizada',unit:'kg',stock:0.5,safety:0.1}

}
function history() {return `<section class="panel"><div class="panel-head"><div><h2>Análises registradas <span class="count">${state.analyses.length}</span></h2><p>Os resultados permanecem iguais mesmo após editar o estoque ou o cardápio.</p></div></div>${state.analyses.length?`<div class="table-scroll"><table><thead><tr><th>Data e hora</th><th>Pedidos</th><th>Críticos</th><th>Pratos afetados</th><th>Origem</th><th>Ações</th></tr></thead><tbody>${state.analyses.map(a=>`<tr><td><strong>${date(a.createdAt)}</strong><small>${a.id.slice(0,8)}</small></td><td>${fmt(a.result.totalOrders)}</td><td>${a.result.rows.filter(r=>r.risk==='critical').length}</td><td>${a.result.menu.filter(m=>m.atRisk).length}</td><td>${badge('Cálculo local')}</td><td>${button('Ver detalhes','analysis-view',a.id,'text')}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma análise registrada','O histórico aparece aqui depois que você registrar a primeira análise.','<a class="btn primary" href="#demanda">Criar primeira análise</a>')}</section>`;}
function about() {return `<div class="bottom-grid"><section class="panel content-card"><p class="eyebrow">O PROJETO</p><h2>Conectar estoque à decisão.</h2><p>O Radar de Ruptura cruza ingredientes, receitas e pedidos estimados para mostrar o que pode faltar e quanto repor. Os dados do Bistrô Horizonte são inteiramente fictícios.</p><h3>O que está funcionando</h3><p>Cadastros, cálculo local, propostas com aprovação humana e histórico por fotografia dos dados. Todas as métricas são derivadas dos cadastros.</p><h3>Automação e IA</h3><p>Automações externas ainda não estão conectadas. As explicações usam regras, sem IA generativa. Nenhum dado é enviado a um provedor externo por esta aplicação.</p><h3>Limites desta demonstração</h3><p>Os dados ficam somente neste navegador. Não há conta, sincronização, compra, recebimento de material, baixa automática ou previsão de vendas. Unidades não são convertidas: informe receitas na unidade do ingrediente. A proteção entre abas detecta versões antigas; não substitui um banco de dados transacional.</p></section><section class="panel content-card"><p class="eyebrow">SEUS DADOS DE DEMONSTRAÇÃO</p><h2>Preserve o que você testou.</h2><p>Exporte uma cópia dos cadastros e do histórico antes de limpar o navegador. O arquivo também serve como evidência de uma simulação.</p>${button('Exportar dados em JSON','export','','primary')}<h3>Restaurar o exemplo</h3><p>Restaura ingredientes, receitas e demanda iniciais e remove o histórico deste navegador. Será necessário confirmar essa ação.</p>${button('Restaurar demonstração','reset','','secondary')}${corrupt?`<h3>Arquivo original preservado</h3><p>Exporte o conteúdo que não pôde ser lido antes de restaurar.</p>${button('Exportar arquivo original','export-raw')}`:''}</section></div>`;}
function dialog(title,body,submitLabel,onSubmit,wide=false) {
  modal.classList.toggle('wide',wide);
  document.querySelector('#modal-content').innerHTML=`<div class="modal-head"><div><p class="eyebrow">RADAR DE RUPTURA</p><h2 id="modal-title">${esc(title)}</h2></div><button class="close" type="button" data-action="close" aria-label="Fechar janela">×</button></div><div class="modal-body">${body}<p id="modal-error" class="form-error" role="alert"></p></div><div class="modal-foot">${button(onSubmit?'Cancelar':'Fechar','close')}${onSubmit?`<button class="btn primary" type="submit">${esc(submitLabel)}</button>`:''}</div>`;
  submitModal=onSubmit; modal.showModal();
}
const field=(label,name,value='',extra='')=>`<label class="field">${label}<input name="${name}" value="${esc(value)}" ${extra}></label>`;
function ingredientForm(id) {
  const original=state.ingredients.find(i=>i.id===id),i=original??{name:'',unit:'un',stock:0,safety:0};
  const used=original && state.recipes.some(r=>r.items.some(it=>it.ingredientId===id));
  dialog(original?'Editar ingrediente':'Novo ingrediente',`${field('Nome do ingrediente','name',i.name,'required maxlength="80"')}<label class="field">Unidade<select name="unit" ${used?'disabled':''}>${['un','kg','L'].map(u=>`<option ${i.unit===u?'selected':''}>${u}</option>`).join('')}</select></label>${used?'<p class="form-note">Para mudar a unidade, remova primeiro os vínculos nas receitas.</p>':''}<div class="field-grid">${field('Estoque disponível','stock',i.stock,'required inputmode="decimal"')}${field('Reserva de segurança','safety',i.safety,'required inputmode="decimal"')}</div><p class="form-note">Até três casas decimais em kg e L. Unidades inteiras. Use ponto ou vírgula como separador decimal, sem separador de milhar.</p>`,'Salvar ingrediente',data=>{
    const unit=used?i.unit:data.get('unit');
    const entry={id:original?.id??uid(),name:text(data.get('name')),unit,stock:quantity(data.get('stock'),unit,'Estoque')/1000,safety:quantity(data.get('safety'),unit,'Reserva')/1000};
    const next=clone(state);original?next.ingredients.splice(next.ingredients.findIndex(i=>i.id===id),1,entry):next.ingredients.push(entry);
    commit(next,'Ingrediente salvo.');
  });
}
function recipeForm(id) {
  if (!state.ingredients.length) {toast('Cadastre ao menos um ingrediente primeiro.');location.hash='estoque';return;}
  const original=state.recipes.find(r=>r.id===id),r=original??{name:'',items:[]};
  dialog(original?'Editar receita':'Novo prato',`${field('Nome do prato','name',r.name,'required maxlength="80"')}<h3>Consumo por porção</h3><p class="form-note">Deixe zero para ingredientes que não fazem parte da receita.</p>${state.ingredients.map(i=>field(`${esc(i.name)} <span class="muted">(${i.unit})</span>`,`q-${i.id}`,r.items.find(it=>it.ingredientId===i.id)?.quantity??0,'required inputmode="decimal"')).join('')}`,'Salvar receita',data=>{
    const entry={id:original?.id??uid(),name:text(data.get('name')),items:state.ingredients.map(i=>({ingredientId:i.id,quantity:quantity(data.get(`q-${i.id}`),i.unit,'Consumo de '+i.name)/1000,unit:i.unit})).filter(i=>i.quantity>0)};
    if (!entry.items.length) throw new Error('Inclua ao menos um ingrediente com consumo maior que zero.');
    const next=clone(state);original?next.recipes.splice(next.recipes.findIndex(r=>r.id===id),1,entry):next.recipes.push(entry);if(!original){next.demand[entry.id]=0;draftDemand[entry.id]=0;}
    commit(next,'Receita salva.');
  });
}
function showAnalysis(id) {
  const a=state.analyses.find(a=>a.id===id);if(!a)return;
  dialog('Resultado da análise',`<p class="muted">${date(a.createdAt)} · ${a.id.slice(0,8)} · cálculo local</p><p>${esc(explain(a.result))}</p>${analysisTable(a.result)}<h3>Pratos e capacidade</h3><p class="form-note">Capacidade isolada: pressupõe que todo o estoque é destinado ao prato. Não some capacidades de pratos com ingredientes compartilhados.</p><div class="table-scroll"><table><thead><tr><th>Prato</th><th>Demanda informada</th><th>Capacidade isolada</th><th>Risco por ingrediente</th></tr></thead><tbody>${a.result.menu.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.demand}</td><td>${m.capacity}</td><td>${m.atRisk?'Sim':'Não'}</td></tr>`).join('')}</tbody></table></div><h3>Dados preservados</h3><p class="form-note">Estoques, reservas, receitas e demanda são da data desta análise.</p><details><summary>Consultar receitas usadas no cálculo</summary>${a.snapshot.recipes.map(r=>`<p><strong>${esc(r.name)}</strong>: ${r.items.map(it=>`${fmt(it.quantity)} ${it.unit} de ${esc(a.snapshot.ingredients.find(i=>i.id===it.ingredientId).name)}`).join('; ')}.</p>`).join('')}</details><div class="callout">${a.proposals.length} proposta(s) gerada(s). Revise a aprovação na seção Reposições. Repor com reserva inclui a falta real e a reserva configurada.</div>`,'',null,true);
}
function download(content,name) {const blob=new Blob([content],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  try {
    const id=b.dataset.id;
    switch(b.dataset.action){
      case 'close':modal.close();break;
      case 'ingredient-new':ingredientForm();break;
      case 'ingredient-edit':ingredientForm(id);break;
      case 'recipe-new':recipeForm();break;
      case 'recipe-edit':recipeForm(id);break;
      case 'analysis-view':showAnalysis(id);break;
      case 'ingredient-delete': {
        removeIngredient(state,id);
        dialog('Excluir ingrediente?',`<p>O ingrediente <strong>${esc(state.ingredients.find(i=>i.id===id).name)}</strong> será removido do cadastro. As análises anteriores permanecem preservadas.</p>`,'Excluir ingrediente',()=>commit(removeIngredient(state,id),'Ingrediente excluído.'));break;
      }
      case 'recipe-delete':dialog('Excluir prato?',`<p>O prato <strong>${esc(state.recipes.find(r=>r.id===id).name)}</strong> e sua estimativa atual serão removidos. O histórico permanece preservado.</p>`,'Excluir prato',()=>{commit(removeRecipe(state,id),'Prato excluído.');delete draftDemand[id];});break;
      case 'approve':case 'reject': {
        const status=b.dataset.action==='approve'?'approved':'rejected';
        const proposal=state.analyses.flatMap(a=>a.proposals).find(p=>p.id===id);
        dialog(status==='approved'?'Aprovar reposição?':'Rejeitar reposição?',`<p><strong>${fmt(proposal.quantity)} ${proposal.unit} de ${esc(proposal.name)}</strong>.</p><p>Esta decisão ficará registrada e não poderá ser alterada nesta demonstração. Não realiza uma compra nem muda o estoque.</p>`,status==='approved'?'Confirmar aprovação':'Confirmar rejeição',()=>commit(decide(state,id,status),'Decisão registrada. Estoque preservado.'));break;
      }
      case 'export':download(JSON.stringify(state,null,2),'radar-de-ruptura-dados.json');toast('Cópia exportada.');break;
      case 'export-raw':download(localStorage.getItem(STORAGE_KEY)??'null','radar-de-ruptura-original.json');break;
      case 'reset':dialog('Restaurar os dados de exemplo?',`<p>Isso apaga os cadastros alterados e todo o histórico deste navegador. Exporte os dados antes de continuar.</p><label class="checkbox"><input type="checkbox" name="confirm" required> Entendo que meus dados de demonstração serão substituídos.</label>`,'Restaurar demonstração',()=>{const next=demo();if(corrupt){localStorage.setItem(STORAGE_KEY,JSON.stringify(next));state=next;corrupt=false;}else{state=save(localStorage,next,state.revision);}draftDemand={...state.demand};render();toast('Dados fictícios restaurados.');});break;
    }
  }catch(error){toast(error.message);}
});
modalForm.addEventListener('submit',e=>{e.preventDefault();if(!submitModal)return;try{submitModal(new FormData(modalForm));modal.close();}catch(error){document.querySelector('#modal-error').textContent=error.message;}});
document.addEventListener('submit',e=>{if(e.target.id!=='demand-form')return;e.preventDefault();try{const data=new FormData(e.target),next=clone(state);next.demand=Object.fromEntries(state.recipes.map(r=>[r.id,orders(data.get(r.id))]));const analysis=newAnalysis(next);next.analyses.unshift(analysis);commit(next,'Análise registrada.');draftDemand={...next.demand};render();showAnalysis(analysis.id);}catch(error){toast(error.message);}});
document.addEventListener('input',e=>{if(e.target.closest('#demand-form')){draftDemand[e.target.name]=e.target.value;document.querySelector('#demand-total').textContent=fmt(state.recipes.reduce((n,r)=>n+(Number(draftDemand[r.id])||0),0))+' pedidos';}});
window.addEventListener('hashchange',()=>{render();document.querySelector('#main').focus();});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY)toast('Dados alterados em outra aba. Recarregue esta página antes de editar.');});
render();
</script></body>
</html>
